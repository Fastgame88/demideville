<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Shop — DEMI DEVILLE</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="shop-page">
  <div id="shopStage" class="shop-stage">
    <div id="shopCanvas" class="shop-canvas">
      <header id="desktopHeader" class="site-header"></header>
      <div id="mobileHeader" class="mobile-header"></div>
      <div id="mobileMenu" class="mobile-menu"></div>

      <main class="shop-wrap">
        <div id="productGrid" class="product-grid"></div>
        <footer class="shop-footer" aria-label="Shop pages">
          <div id="shopPagination" class="shop-pagination" aria-label="Pagination"></div>
          <span class="shop-page-indicator" aria-hidden="true"></span>
          <div class="shop-terms">Terms and polices</div>
        </footer>
      </main>

      <button id="shopSupportOpen" class="support-btn shop-support" type="button">SUPPORT</button>

      <div id="shopSupportLayer" class="support-layer shop-support-layer" aria-hidden="true">
        <div class="support-window shop-support-window" role="dialog" aria-label="DEMI DEVILLE support">
          <button id="shopSupportClose" class="support-close" type="button" aria-label="Close support">×</button>
          <div class="support-panel">
            <div class="support-brand">DEMI DEVILLE</div>
            <div class="support-chat-body support-email-body shop-support-body">
              <div class="support-start support-form-heading">SEND A MESSAGE</div>
              <form id="shopSupportForm" class="support-form" novalidate>
                <input id="shopSupportEmail" class="support-form-input" name="email" type="email" autocomplete="email" required placeholder="YOUR EMAIL">
                <textarea id="shopSupportMessage" class="support-form-message" name="message" required placeholder="HOW CAN WE HELP?"></textarea>
                <button id="shopSupportSubmit" class="support-form-submit" type="submit">SEND</button>
                <div id="shopSupportStatus" class="support-form-status" aria-live="polite"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/common.js?v=20260919-mobile-cards-support-v1"></script>
  <script src="/assets/js/shop.js"></script>
</body>
</html>
