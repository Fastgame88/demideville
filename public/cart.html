<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bag — DEMI DEVILLE</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="gallery-page cart-page">
  <header id="desktopHeader" class="site-header"></header>
  <div id="mobileHeader" class="mobile-header"></div>
  <div id="mobileMenu" class="mobile-menu"></div>

  <div class="cart-canvas-shell">
    <div id="cartCanvas" class="cart-canvas">
      <main class="cart-wrap">
        <section id="cartItems" class="cart-items"></section>
        <aside class="cart-summary">
          <button id="checkoutButton" class="checkout-btn" type="button">Check Out</button>
          <div class="total-row"><span>Total</span><span id="cartTotal">0$</span></div>
        </aside>
      </main>
    </div>
  </div>

  <button id="supportOpen" class="support-btn" type="button">SUPPORT</button>
  <div id="supportLayer" class="support-layer gallery-support-layer" aria-hidden="true">
    <div class="support-window gallery-support-window" role="dialog" aria-label="DEMI DEVILLE support">
      <button id="supportClose" class="support-close" type="button" aria-label="Close support">×</button>
      <div class="support-panel">
        <div class="support-brand">DEMI DEVILLE</div>
        <div class="support-chat-body support-email-body">
          <div class="support-start support-form-heading">SEND A MESSAGE</div>
          <form id="supportForm" class="support-form" novalidate>
            <input id="supportSenderEmail" class="support-form-input" name="email" type="email" autocomplete="email" required placeholder="YOUR EMAIL">
            <textarea id="supportMessage" class="support-form-message" name="message" required placeholder="HOW CAN WE HELP?"></textarea>
            <button id="supportSubmit" class="support-form-submit" type="submit">SEND</button>
            <div id="supportFormStatus" class="support-form-status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/common.js?v=20260917-header-visual-restore-v2"></script>
  <script src="/assets/js/cart.js"></script>
</body>
</html>
